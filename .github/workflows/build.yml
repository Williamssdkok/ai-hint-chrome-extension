name: Build extension editions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Create standard and Lite packages
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Edition Standard
          ./scripts/package.ps1 -Edition Lite
      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: ai-hint-editions
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
