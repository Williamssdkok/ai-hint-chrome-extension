<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7ff">
  <title>AI Hint</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="topbar">
      <div class="brand-mark mascot" aria-hidden="true"><span class="mascot-face">✦</span></div>
      <div class="brand-copy">
        <div class="name">AI HINT</div>
        <div class="sub">Твой умный спутник в браузере</div>
      </div>
      <span class="topbar-tag">ПОМОЩНИК</span>
    </header>

    <section class="mode" id="modeCard" aria-label="Текущий режим AI Hint">
      <div class="mode-icon" aria-hidden="true"><span>✧</span></div>
      <div class="mode-copy">
        <b id="modeTitle">AI HINT</b>
        <span class="mode-meta"><i class="status-dot"></i><span id="modeStatus">LOCAL · Chrome AI</span></span>
      </div>
      <button class="mode-toggle" id="modeToggle" type="button">PRO</button>
    </section>

    <section class="depth-row">
      <div>
        <label for="depth">ДЛИНА ОТВЕТА</label>
        <span class="depth-note">Меняется в один клик</span>
      </div>
      <select id="depth" aria-label="Длина ответа">
        <option value="short">Quick</option>
        <option value="smart">Smart</option>
        <option value="deep">Deep</option>
      </select>
    </section>

    <section class="depth-row style-row">
      <div>
        <label for="answerStyle">РЕЖИМ ОТВЕТА</label>
        <span class="depth-note" id="styleHint">Коротко и по делу</span>
      </div>
      <select id="answerStyle" aria-label="Режим ответа">
        <option value="auto">Авто</option>
        <option value="balanced">Обычный</option>
        <option value="study">Учёба</option>
        <option value="code">Код</option>
        <option value="translate">Перевод</option>
      </select>
    </section>

    <button class="primary" id="test" type="button"><span class="button-spark" aria-hidden="true">✦</span><span>Проверить Lite</span><span class="button-arrow" aria-hidden="true">↗</span></button>
    <p class="primary-caption">Выдели фрагмент на странице — AI Hint подскажет ответ</p>
    <button class="secondary page-action" id="summarizePage" type="button"><span class="action-icon" aria-hidden="true">▤</span><span>Кратко о странице</span><span class="action-arrow" aria-hidden="true">→</span></button>

    <div class="actions">
      <button class="secondary game-action" id="game" type="button"><span class="action-icon" aria-hidden="true">▦</span><span>Математический блиц</span><span class="action-arrow" aria-hidden="true">→</span></button>
      <button class="secondary settings-action" id="settings" type="button"><span class="action-icon" aria-hidden="true">⚙</span><span>Настройки</span><span class="action-arrow" aria-hidden="true">→</span></button>
      <button class="secondary history-action" id="history" type="button"><span class="action-icon" aria-hidden="true">◷</span><span>Буфер ответов</span><span class="action-arrow" aria-hidden="true">→</span></button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>
    <footer><span class="shortcut-key">Ctrl</span><span>+</span><span class="shortcut-key">Shift</span><span>+</span><span class="shortcut-key">Space</span><span class="footer-hint">чтобы спросить</span></footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
